<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <linearGradient id="grn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.72" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid1" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#10b981" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="360" fill="url(#bg1)"/>
  <rect width="800" height="360" fill="url(#grid1)"/>
  <rect width="800" height="360" fill="url(#glow1)"/>

  <!-- faint binary rain -->
  <g fill="#10b981" fill-opacity="0.12" font-size="16">
    <text x="70" y="70">01001</text>
    <text x="150" y="300">1101</text>
    <text x="640" y="90">0110</text>
    <text x="700" y="250">10011</text>
    <text x="560" y="320">01</text>
  </g>

  <!-- shield with padlock -->
  <g transform="translate(560,180)">
    <path d="M0,-108 L96,-74 V6 C96,68 52,104 0,124 C-52,104 -96,68 -96,6 V-74 Z"
          fill="#0e1a2b" stroke="url(#grn1)" stroke-width="4"/>
    <path d="M0,-92 L80,-63 V4 C80,56 44,88 0,105 C-44,88 -80,56 -80,4 V-63 Z"
          fill="#10b981" fill-opacity="0.08"/>
    <!-- padlock body -->
    <rect x="-34" y="-8" width="68" height="56" rx="8" fill="url(#grn1)"/>
    <path d="M-20,-8 V-26 a20,20 0 0 1 40,0 V-8" fill="none" stroke="url(#grn1)" stroke-width="9"/>
    <circle cx="0" cy="16" r="8" fill="#08121d"/>
    <rect x="-3" y="16" width="6" height="16" rx="3" fill="#08121d"/>
  </g>

  <!-- course tag -->
  <g>
    <rect x="48" y="46" width="150" height="34" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="66" y="69" fill="#6bcfa5" font-size="16" font-weight="700" letter-spacing="2">COURSE 01</text>
  </g>

  <!-- title -->
  <text x="48" y="210" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="1">CYBER</text>
  <text x="48" y="262" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="1">SECURITY</text>
  <text x="50" y="298" fill="#6bcfa5" font-size="17" font-weight="600" letter-spacing="2">BASIC &#8594; ADVANCED &#8226; ETHICAL HACKING</text>
</svg>
