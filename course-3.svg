<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <linearGradient id="grn3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.72" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid3" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#10b981" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="360" fill="url(#bg3)"/>
  <rect width="800" height="360" fill="url(#grid3)"/>
  <rect width="800" height="360" fill="url(#glow3)"/>

  <!-- SOC monitor with threat pulse -->
  <g transform="translate(560,150)">
    <!-- radar arcs -->
    <g fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="2">
      <circle cx="0" cy="0" r="120"/>
      <circle cx="0" cy="0" r="88"/>
    </g>
    <!-- screen -->
    <rect x="-110" y="-78" width="220" height="140" rx="12" fill="#0e1a2b" stroke="url(#grn3)" stroke-width="4"/>
    <rect x="-94" y="-62" width="188" height="108" rx="6" fill="#10b981" fill-opacity="0.06"/>
    <!-- pulse / heartbeat line -->
    <polyline points="-92,0 -60,0 -44,-34 -20,40 4,-20 24,0 94,0"
              fill="none" stroke="#6bcfa5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- stand -->
    <rect x="-16" y="62" width="32" height="20" fill="url(#grn3)"/>
    <rect x="-44" y="82" width="88" height="8" rx="4" fill="url(#grn3)"/>
    <!-- alert dot -->
    <circle cx="86" cy="-52" r="9" fill="#34d399"/>
  </g>

  <!-- course tag -->
  <g>
    <rect x="48" y="46" width="150" height="34" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="66" y="69" fill="#6bcfa5" font-size="16" font-weight="700" letter-spacing="2">COURSE 03</text>
  </g>

  <!-- title -->
  <text x="48" y="210" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="1">SOC</text>
  <text x="48" y="262" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="1">ANALYST</text>
  <text x="50" y="298" fill="#6bcfa5" font-size="17" font-weight="600" letter-spacing="2">SIEM &#8226; THREAT MONITORING &#8226; JOB READY</text>
</svg>
